  "abstract": "The Mobius Bridge of Nasr and Carlini removes one guessed key byte from meet-in-the-middle attacks on 7-round AES by constructing a fingerprint invariant under the group action that survives the S-box. Their derivation is written for the AES S-box, which is field inversion followed by a GF(2)-affine map. This note shows the construction is not specific to that shape. For any S-box of the form S = L2 . Frob^j . inv . L1, with L1 and L2 GF(2)-affine bijections and Frob the squaring map, the same reciprocal-and-reparametrize step yields an affine bridge identity in which both parameters are raised to the 2^j power and the multiplier remains the square of the translation. The Frobenius exponent is the only degree of freedom. AES instantiates the case j = 0 with L1 = id. ARIA instantiates four distinct members at exponents 0, 3, 0 and 5: S1, S2, S1^{-1} and S2^{-1}. The bad indices move from 0 to L1^{-1}(0), which for ARIA's inverse S-boxes are the affine constants, so the published bad-index treatment does not port unchanged. The bridge identities are verified exhaustively over GF(2^8) and formalized in Lean 4. No attack complexities for ARIA are claimed.",
