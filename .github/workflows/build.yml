name: build

# CI for the Lean 4 + mathlib project: install the pinned toolchain via
# elan, fetch mathlib prebuilt oleans, run a full `lake build`, then the
# pure-stdlib Python bridge-class verifier. Public repo, so hosted minutes
# are free; weekly schedule catches bit-rot / mathlib drift.
#
# Toolchain and mathlib are both pinned (lean-toolchain =
# leanprover/lean4:v4.32.2; lakefile.toml requires mathlib rev v4.32.2);
# .lake/build cache is keyed on toolchain + lakefile + manifest.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 6 * * 1" # Mondays ~02:23 ET, weekly build health check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache elan toolchains
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ hashFiles('lean-toolchain') }}

      - name: Cache lake build artifacts
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Update dependencies
        run: lake update

      - name: Fetch mathlib prebuilt oleans
        run: lake exe cache get

      - name: Full build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: Bridge-class verifier
        run: python3 verify_bridge_class.py

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lake-build-log
          path: build.log
